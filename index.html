<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DOOM BOX DESKTOP</title>
<style>
/* ============================================================
   DOOM BOX — tactical command shell
   Vanilla CSS / Vanilla JS. No frameworks. No CDN.
   ============================================================ */

:root{
  --scale: 1;

  /* DARK (default) */
  --bg-primary:  #12121E;
  --bg-secondary:#1A1A2E;
  --bg-card:     #0C1018;
  --accent:      #E8B54A;   /* amber — brand */
  --text-1:      #FFFFFF;
  --text-2:      #8898AA;
  --green:       #5DD87A;
  --blue:        #5EB8E8;
  --orange:      #CC5511;
  --purple:      #B08CF0;
  --red:         #EE4444;

  --line:        rgba(232,181,74,0.14);
  --line-soft:   rgba(136,152,170,0.16);

  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;
  --font-ui:Arial,'Helvetica Neue',Helvetica,sans-serif;

  --topbar-h:58px;
  --ticker-h:30px;
  --side-w:92px;
  --side-w-collapsed:48px;
}

html[data-mode="dim"]{
  --bg-primary:  #20202F;
  --bg-secondary:#2A2A40;
  --bg-card:     #161D29;
  --text-2:      #9AAAC0;
  --line:        rgba(232,181,74,0.20);
  --line-soft:   rgba(154,170,192,0.20);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:calc(16px * var(--scale));overflow-x:hidden;}
body{
  background:var(--bg-primary);
  color:var(--text-1);
  font-family:var(--font-ui);
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease;
}

.mono{font-family:var(--font-mono);}
.dim{color:var(--text-2);}

/* ---- corner-bracket card (pure CSS, no SVG) ---- */
.brk{
  --bk:var(--accent); --bt:1px; --bl:13px;
  border:1px solid var(--line);
  background:
   linear-gradient(var(--bk),var(--bk)) no-repeat 0 0      / var(--bl) var(--bt),
   linear-gradient(var(--bk),var(--bk)) no-repeat 0 0      / var(--bt) var(--bl),
   linear-gradient(var(--bk),var(--bk)) no-repeat 100% 0   / var(--bl) var(--bt),
   linear-gradient(var(--bk),var(--bk)) no-repeat 100% 0   / var(--bt) var(--bl),
   linear-gradient(var(--bk),var(--bk)) no-repeat 0 100%   / var(--bl) var(--bt),
   linear-gradient(var(--bk),var(--bk)) no-repeat 0 100%   / var(--bt) var(--bl),
   linear-gradient(var(--bk),var(--bk)) no-repeat 100% 100%/ var(--bl) var(--bt),
   linear-gradient(var(--bk),var(--bk)) no-repeat 100% 100%/ var(--bt) var(--bl),
   var(--bg-card);
}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  height:var(--topbar-h);min-height:var(--topbar-h);
  background:var(--bg-secondary);
  border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;
  flex:0 0 auto;position:relative;z-index:30;
}
.topbar::after{ /* amber baseline glow */
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.5;
}

.brand{
  display:flex;align-items:center;gap:.7rem;
  padding:0 18px;border-right:1px solid var(--line-soft);
  min-width:0;flex:0 0 auto;
}
.brand .glyph{
  width:26px;height:26px;flex:0 0 auto;
  border:1.5px solid var(--accent);
  display:grid;place-items:center;
  color:var(--accent);font-family:var(--font-mono);
  font-size:.8rem;font-weight:700;line-height:1;
  box-shadow:0 0 12px rgba(232,181,74,.25);
}
.brand .word{
  font-family:var(--font-mono);font-weight:700;
  letter-spacing:.18em;font-size:1rem;color:var(--accent);
  white-space:nowrap;
}
.brand .cursor{
  display:inline-block;width:.5em;height:1.05em;
  background:var(--accent);margin-left:.15em;translate:0 .12em;
  animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}

.tb-center{
  flex:1;display:flex;align-items:center;gap:18px;
  padding:0 16px;min-width:0;overflow:hidden;
}
.coord{
  display:flex;align-items:center;gap:.55rem;
  font-family:var(--font-mono);font-size:.82rem;
  color:var(--text-1);letter-spacing:.04em;white-space:nowrap;
}
.coord .lbl{color:var(--text-2);font-size:.66rem;letter-spacing:.12em;}
.coord:first-child{flex:0 0 auto;}
.gps-dot{
  width:9px;height:9px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 0 rgba(93,216,122,.55);
  animation:gpspulse 2s ease-out infinite;flex:0 0 auto;
}
@keyframes gpspulse{
  0%{box-shadow:0 0 0 0 rgba(93,216,122,.55);}
  70%{box-shadow:0 0 0 7px rgba(93,216,122,0);}
  100%{box-shadow:0 0 0 0 rgba(93,216,122,0);}
}

.tb-right{
  display:flex;align-items:stretch;gap:0;
  border-left:1px solid var(--line-soft);
}
.chips{
  display:flex;align-items:center;gap:8px;padding:0 16px;
  border-right:1px solid var(--line-soft);
}
.chip{
  display:flex;align-items:center;gap:.4rem;
  padding:5px 9px;border:1px solid var(--line-soft);
  background:var(--bg-card);
  font-family:var(--font-mono);font-size:.66rem;letter-spacing:.06em;
  white-space:nowrap;
}
.chip .k{color:var(--text-2);}
.chip .v{color:var(--text-1);}
.chip .d{width:7px;height:7px;flex:0 0 auto;}

.clock{
  display:flex;flex-direction:column;justify-content:center;
  align-items:flex-end;padding:0 16px;border-right:1px solid var(--line-soft);
}
.clock .z{
  font-family:var(--font-mono);font-size:1.18rem;font-weight:700;
  color:var(--accent);letter-spacing:.05em;line-height:1.05;
}
.clock .date{
  font-family:var(--font-mono);font-size:.6rem;color:var(--text-2);
  letter-spacing:.16em;
}

.controls{display:flex;align-items:center;gap:8px;padding:0 16px;}
.ctl{
  font-family:var(--font-mono);font-size:.66rem;letter-spacing:.08em;
  color:var(--text-2);background:var(--bg-card);
  border:1px solid var(--line-soft);padding:6px 10px;cursor:pointer;
  display:flex;align-items:center;gap:.4rem;transition:.12s;
}
.ctl:hover{color:var(--accent);border-color:var(--accent);}
.ctl .sw{width:8px;height:8px;background:var(--accent);flex:0 0 auto;}
.fontctl{display:flex;border:1px solid var(--line-soft);background:var(--bg-card);}
.fontctl button{
  font-family:var(--font-mono);background:none;border:none;color:var(--text-2);
  cursor:pointer;padding:6px 9px;font-size:.72rem;transition:.12s;
}
.fontctl button:hover{color:var(--accent);}
.fontctl .pct{
  color:var(--text-1);font-size:.62rem;display:grid;place-items:center;
  min-width:42px;border-left:1px solid var(--line-soft);
  border-right:1px solid var(--line-soft);letter-spacing:.04em;
}
/* window close — amber X, square L-bracket corners, mono tooltip */
.ctl-close{
  position:relative;width:34px;height:30px;display:grid;place-items:center;
  background:var(--bg-card);border:1px solid var(--line-soft);
  color:var(--accent);font-family:var(--font-mono);font-size:.95rem;line-height:1;cursor:pointer;transition:.12s;
}
.ctl-close::before{
  content:"";position:absolute;inset:2px;pointer-events:none;opacity:.75;background:
    linear-gradient(var(--accent),var(--accent)) no-repeat 0 0       / 7px 1px,
    linear-gradient(var(--accent),var(--accent)) no-repeat 0 0       / 1px 7px,
    linear-gradient(var(--accent),var(--accent)) no-repeat 100% 100% / 7px 1px,
    linear-gradient(var(--accent),var(--accent)) no-repeat 100% 100% / 1px 7px;
}
.ctl-close:hover{background:var(--accent);color:#12121E;border-color:var(--accent);}
.ctl-close:hover::before{opacity:0;}
.ctl-close[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;
  background:var(--bg-secondary);border:1px solid var(--line);color:var(--text-1);
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;padding:5px 9px;white-space:nowrap;z-index:60;
}

/* ============================================================
   TICKER
   ============================================================ */
.ticker{
  height:var(--ticker-h);min-height:var(--ticker-h);flex:0 0 auto;
  background:var(--bg-card);border-bottom:1px solid var(--line-soft);
  display:flex;align-items:stretch;overflow:hidden;position:relative;z-index:20;
}
.ticker-tag{
  display:flex;align-items:center;padding:0 14px;
  background:var(--accent);color:#12121E;
  font-family:var(--font-mono);font-weight:700;font-size:.64rem;
  letter-spacing:.18em;flex:0 0 auto;z-index:2;
}
.ticker-track-wrap{flex:1;overflow:hidden;display:flex;align-items:center;}
.ticker-track{
  display:inline-flex;align-items:center;white-space:nowrap;
  animation:tick 109s linear infinite;will-change:transform;
}
.ticker:hover .ticker-track{animation-play-state:paused;}
@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.ti{
  display:inline-flex;align-items:center;gap:.5rem;padding:0 26px;
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.02em;
  border-right:1px solid var(--line-soft);
}
.ti .t{color:var(--text-2);font-size:.62rem;}
.ti .tg{font-weight:700;font-size:.6rem;letter-spacing:.1em;}

/* ============================================================
   MAIN
   ============================================================ */
.main{flex:1;display:flex;min-height:0;}

.sidebar{
  flex:0 0 auto;width:var(--side-w);
  background:var(--bg-secondary);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:10px 0;
  transition:width .28s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.sidebar .side-head{display:none;}
.navitem{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:10px 4px;min-height:60px;cursor:pointer;position:relative;
  transition:background .12s;text-align:center;
}
.navitem:hover{background:var(--bg-card);}
.navitem .ic{
  width:25px;height:25px;flex:0 0 auto;color:var(--accent);opacity:.85;
  display:grid;place-items:center;transition:.12s;
}
.navitem .ic svg{width:100%;height:100%;display:block;}
.navitem .meta{display:flex;flex-direction:column;align-items:center;min-width:0;}
.navitem .nm{
  font-family:var(--font-ui);font-weight:700;font-size:.62rem;
  color:var(--text-1);letter-spacing:.09em;line-height:1.1;
}
.navitem .ds{display:none;}
.navitem .badge{
  position:absolute;top:8px;right:14px;width:8px;height:8px;
  background:var(--red);box-shadow:0 0 8px var(--red);display:none;
}
.navitem.has-unread .badge{display:block;animation:blink 1.4s steps(1) infinite;}
.navitem.active{background:var(--accent);}
.navitem.active .ic{color:#12121E;opacity:1;}
.navitem.active .nm{color:#12121E;}
.navitem.active .badge{background:#12121E;box-shadow:none;}
#navHome .navitem{border-bottom:1px solid var(--line-soft);}
.side-foot{display:none;}

/* collapsed (MAP) */
.main.map-mode .sidebar{width:var(--side-w-collapsed);}
.main.map-mode .side-head,
.main.map-mode .side-foot{opacity:0;pointer-events:none;}
.main.map-mode .sidebar{overflow:visible;}
.main.map-mode .navitem{justify-content:center;padding:8px 0;}
.main.map-mode .navitem .meta{
  position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
  opacity:0;pointer-events:none;background:var(--bg-secondary);
  border:1px solid var(--line);padding:9px 13px;min-width:160px;z-index:60;
  box-shadow:0 8px 22px rgba(0,0,0,.55);
}
.main.map-mode .navitem:hover .meta{opacity:1;}
.main.map-mode .navitem .ic{width:30px;height:30px;}

/* ---- content ---- */
.content{
  flex:1;min-width:0;min-height:0;position:relative;overflow:auto;
  background:
    linear-gradient(rgba(136,152,170,.035) 1px,transparent 1px) 0 0/100% 40px,
    linear-gradient(90deg,rgba(136,152,170,.035) 1px,transparent 1px) 0 0/40px 100%,
    var(--bg-primary);
  padding:24px;
}
.crumb{
  display:flex;align-items:center;gap:.6rem;margin-bottom:18px;
  font-family:var(--font-mono);font-size:.66rem;letter-spacing:.1em;color:var(--text-2);
}
.crumb .cur{color:var(--accent);}

.placeholder{
  height:calc(100% - 40px);min-height:340px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;padding:40px;text-align:center;position:relative;
}
.ph-id{
  font-family:var(--font-mono);font-size:.66rem;letter-spacing:.4em;
  color:var(--text-2);
}
.ph-name{
  font-family:var(--font-mono);font-weight:700;letter-spacing:.12em;
  font-size:clamp(2.4rem,7vw,4.6rem);color:var(--accent);line-height:1;
  text-shadow:0 0 40px rgba(232,181,74,.2);
}
.ph-desc{
  font-family:var(--font-ui);color:var(--text-1);font-size:.95rem;
  max-width:560px;line-height:1.55;
}
.ph-status{
  display:inline-flex;align-items:center;gap:.6rem;margin-top:8px;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.16em;
  color:var(--text-2);border:1px solid var(--line-soft);
  background:var(--bg-card);padding:8px 16px;
}
.ph-status .blip{width:8px;height:8px;background:var(--accent);animation:blink 1.4s steps(1) infinite;}

/* ============================================================
   HOME / WELCOME DASHBOARD
   ============================================================ */
.home{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,20px);padding-bottom:8px;}
.home-head{text-align:center;padding:4px 0 0;}
.hh-title{
  font-family:var(--font-mono);font-weight:700;color:var(--accent);
  font-size:clamp(1.8rem,3.5vw,2.8rem);letter-spacing:.34em;line-height:1;
  text-indent:.34em;text-shadow:0 0 36px rgba(232,181,74,.28);
}
.hh-sub{
  margin-top:5px;font-family:var(--font-ui);font-weight:700;color:var(--text-2);
  font-size:clamp(.7rem,1.4vw,.92rem);letter-spacing:.42em;text-indent:.42em;
}
.hh-meta{margin-top:5px;color:var(--text-1);font-size:.74rem;letter-spacing:.12em;}
.hh-rule{
  height:1px;width:100%;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.6;
}
.intel-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
@media (max-width:980px){.intel-grid{grid-template-columns:1fr;}}

.icard{padding:0;display:flex;flex-direction:column;--bg-card:var(--bg-secondary);
  border-color:rgba(232,181,74,.32);min-height:0;}
.icard-head{
  display:flex;align-items:center;gap:11px;padding:14px 16px 12px 18px;
  border-bottom:1px solid var(--line-soft);position:relative;
}
.icard-head::before{content:"";position:absolute;left:0;top:14px;bottom:12px;width:3px;background:var(--ac);}
.icard-ic{width:22px;height:22px;color:var(--ac);flex:0 0 auto;display:grid;place-items:center;}
.icard-ic svg{width:100%;height:100%;}
.icard-htext{display:flex;flex-direction:column;min-width:0;}
.icard-title{font-family:var(--font-ui);font-weight:700;color:var(--accent);font-size:.92rem;letter-spacing:.1em;}
.icard-sub{font-family:var(--font-mono);font-size:.56rem;color:var(--text-2);letter-spacing:.16em;margin-top:2px;}
.icard-unread{
  margin-left:auto;min-width:20px;height:20px;padding:0 5px;background:var(--green);
  color:#0C1018;font-family:var(--font-mono);font-weight:700;font-size:.64rem;
  display:none;place-items:center;
}
.icard-list{flex:1;display:flex;flex-direction:column;padding:6px 0;}
.ifeed{
  display:flex;align-items:baseline;gap:9px;padding:7px 16px;
  font-family:var(--font-mono);font-size:.7rem;line-height:1.3;
  border-bottom:1px solid rgba(136,152,170,.07);
}
.ifeed .ts{color:var(--text-2);font-size:.62rem;flex:0 0 auto;}
.ifeed .hl{color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.ifeed.crime .ctype{color:var(--red);font-weight:700;flex:0 0 auto;}
.ifeed.crime .cloc{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ifeed.crime.recent .ctype{text-shadow:0 0 8px rgba(238,68,68,.65);}
.ifeed.mesh .cs{font-weight:700;flex:0 0 auto;}
.ifeed.mesh .mmsg{color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.viewall{
  margin:8px 12px 12px;align-self:flex-start;
  font-family:var(--font-mono);font-size:.62rem;letter-spacing:.16em;
  color:var(--ac);background:transparent;border:1px solid var(--ac);
  padding:7px 14px;cursor:pointer;transition:.12s;
}
.viewall:hover{background:var(--ac);color:#0C1018;}

@keyframes cardpulse{0%{box-shadow:0 0 0 0 rgba(232,181,74,0);}25%{box-shadow:0 0 16px 1px rgba(232,181,74,.4);}100%{box-shadow:0 0 0 0 rgba(232,181,74,0);}}
.icard.pulse{animation:cardpulse 1.3s ease-out;}
.icard.threat-hot{--bk:var(--red);border-color:var(--red);animation:redglow 2.2s ease-in-out infinite;}
@keyframes redglow{0%,100%{box-shadow:0 0 10px rgba(238,68,68,.16);}50%{box-shadow:0 0 22px rgba(238,68,68,.42);}}

.status-row{display:flex;flex-wrap:wrap;align-items:stretch;padding:0;--bg-card:var(--bg-secondary);}
.scell{
  flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px;
  padding:12px 18px;border-right:1px solid var(--line-soft);
}
.scell:last-child{border-right:none;}
.scell .sk{font-family:var(--font-mono);font-size:.58rem;letter-spacing:.18em;color:var(--text-2);}
.scell .sv{font-family:var(--font-mono);font-size:.82rem;color:var(--text-1);display:flex;align-items:center;gap:7px;letter-spacing:.04em;}
.scell .sdot{width:8px;height:8px;flex:0 0 auto;}
.scell .sx{color:var(--text-2);font-size:.66rem;}

@media (max-width:1200px){
  .coord-ll{display:none;}
}
@media (max-width:1024px){
  .chips{display:none;}
}
@media (max-width:760px){
  .chips,.brand .word{display:none;}
  .brand{min-width:auto;}
}

/* ===== Node-RED OFFLINE full-card state ===== */
.db-offline{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(10,10,18,.92);backdrop-filter:blur(2px);}
.db-offline.show{display:flex;}
.db-offline .dbo-card{--bg-card:var(--bg-primary);padding:34px 46px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:12px;min-width:360px;}
.db-offline .dbo-spinner{width:34px;height:34px;border:3px solid var(--line-soft);border-top-color:var(--accent);
  border-radius:50%;animation:dbo-spin 1s linear infinite;margin-bottom:4px;}
@keyframes dbo-spin{to{transform:rotate(360deg);}}
.db-offline .dbo-title{font-family:var(--font-ui);font-weight:700;letter-spacing:.2em;color:var(--red);font-size:1.05rem;}
.db-offline .dbo-sub{font-family:var(--font-mono);letter-spacing:.18em;color:var(--accent);font-size:.78rem;}
.db-offline .dbo-dots::after{content:'';animation:dbo-dots 1.4s steps(4,end) infinite;}
@keyframes dbo-dots{0%{content:'';}25%{content:'.';}50%{content:'..';}75%{content:'...';}}
.db-offline .dbo-meta{color:var(--text-2);font-size:.62rem;letter-spacing:.04em;max-width:340px;line-height:1.5;}

/* ===== desktop-mode: hide all scrollbars (kiosk instance with ?desktop=1) ===== */
body.desktop-mode{scrollbar-width:none;}
body.desktop-mode::-webkit-scrollbar{display:none;}
body.desktop-mode .content{scrollbar-width:none;}
body.desktop-mode .content::-webkit-scrollbar{display:none;}
</style>

<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <div class="brand">
      <div class="glyph">DB</div>
      <div class="word">DOOM&nbsp;BOX<span class="cursor"></span></div>
    </div>

    <div class="tb-center">
      <div class="coord">
        <span class="gps-dot"></span>
        <span class="lbl">MGRS</span>
        <span id="mgrs">—</span>
      </div>

    if(id==='SYS'){ c.style.position='relative'; c.style.overflow='hidden'; }
    if(id==='HOME'){ c.innerHTML=homeHTML(); renderHomeCards(); return; }
    if(id==='MAP'){
      c.style.overflow='hidden';
      if(window.DBMap && DBMap.ui){ DBMap.ui.mount(c); }
      else { c.innerHTML='<section class="placeholder brk"><div class="ph-name">MAP</div><div class="ph-status"><span class="blip"></span>MAP ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='OSINT'){
      if(window.DBOsint && DBOsint.mount){ DBOsint.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">OSINT</div><div class="ph-status"><span class="blip"></span>OSINT ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='WX'){
      if(window.DBWx && DBWx.mount){ DBWx.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">WX</div><div class="ph-status"><span class="blip"></span>WX ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='ADSB'){
      if(window.DBAdsb && DBAdsb.mount){ DBAdsb.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">ADS-B</div><div class="ph-status"><span class="blip"></span>ADS-B ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='CONFLICT'){
      c.style.padding='0'; c.style.overflow='hidden';
      if(window.DBConflict && DBConflict.mount){ DBConflict.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">CONFLICT</div><div class="ph-status"><span class="blip"></span>CONFLICT ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='MESH'){
      if(window.DBMesh && DBMesh.mount){ DBMesh.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">MESH</div><div class="ph-status"><span class="blip"></span>MESH ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='SIGINT'){
      if(window.DBSigint && DBSigint.mount){ DBSigint.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">SIGINT</div><div class="ph-status"><span class="blip"></span>SIGINT ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='MEDIA'){
      if(window.DBMedia && DBMedia.mount){ DBMedia.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">MEDIA</div><div class="ph-status"><span class="blip"></span>MEDIA ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='AI'){
      if(window.DBAi && DBAi.mount){ DBAi.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">AI</div><div class="ph-status"><span class="blip"></span>AI ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    if(id==='SYS'){
      if(window.DBSys && DBSys.mount){ DBSys.mount(c); }
      else { c.style.padding=''; c.innerHTML='<section class="placeholder brk"><div class="ph-name">SYS</div><div class="ph-status"><span class="blip"></span>SYS ENGINE FAILED TO LOAD</div></section>'; }
      return;
    }
    var tab=TABS.filter(function(t){return t.id===id;})[0];
    if(!tab){ c.innerHTML=homeHTML(); renderHomeCards(); return; }
    c.innerHTML=
      '<div class="crumb"><span>DOOM BOX</span><span>/</span><span class="cur">'+tab.name+'</span></div>'+
      '<section class="placeholder brk">'+
        '<div class="ph-id">// MODULE '+tab.key+' SELECTED</div>'+
        '<div class="ph-name">'+tab.name+'</div>'+
        '<div class="ph-desc">'+tab.desc+'</div>'+
        '<div class="ph-status"><span class="blip"></span>AWAITING MODULE LOAD</div>'+
      '</section>';
  }
  function setActive(id){
    active=id; localStorage.setItem('db_tab',id);
    [].forEach.call(document.querySelectorAll('.navitem'),function(n){
      n.classList.toggle('active', n.getAttribute('data-id')===id);
    });
    el('main').classList.toggle('map-mode', id==='MAP');
    if(id==='MESH'){meshUnread=0; unread.MESH=0;}
    if(unread[id]!==undefined && id!=='WX')unread[id]=0;
    renderNavBadges();
    renderContent(id);
  }

  /* ---------------- keyboard hotkeys 1-9,0 ---------------- */
  document.addEventListener('keydown',function(e){
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==='h'||e.key==='H'||e.key==='`'){setActive('HOME');return;}
    var t=TABS.filter(function(x){return x.key===e.key;})[0];
    if(t){setActive(t.id);}
  });

  /* ---------------- zulu clock ---------------- */
  var MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function pad(n){return (n<10?'0':'')+n;}
  function tick(){
    var d=new Date();
    el('zulu').textContent=pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+'Z';
    el('zdate').textContent=pad(d.getUTCDate())+MON[d.getUTCMonth()]+String(d.getUTCFullYear()).slice(2)+' UTC';
    var hz=el('homeZ'); if(hz)hz.textContent=fmtHome();
  }
  tick();setInterval(tick,1000);

  /* ---------------- mode toggle ---------------- */
  var mode=localStorage.getItem('db_mode')||'dark';
  function applyMode(){
    document.documentElement.setAttribute('data-mode',mode);
    el('modeLbl').textContent = mode==='dark'?'DARK':'DIM';
    localStorage.setItem('db_mode',mode);
  }
  applyMode();
  el('modeBtn').addEventListener('click',function(){
    mode = mode==='dark'?'dim':'dark'; applyMode();
  });

  /* ---------------- font scale ---------------- */
  var STEPS=[0.875,1,1.125,1.25];
  var si=parseInt(localStorage.getItem('db_fs'),10);
  if(isNaN(si)||si<0||si>=STEPS.length) si=1;
  function applyFs(){
    document.documentElement.style.setProperty('--scale',STEPS[si]);
    el('fsPct').textContent=Math.round(STEPS[si]*100)+'%';
    localStorage.setItem('db_fs',si);
  }
  applyFs();
  el('fsUp').addEventListener('click',function(){ if(si<STEPS.length-1){si++;applyFs();} });
  el('fsDown').addEventListener('click',function(){ if(si>0){si--;applyFs();} });
  /* close window — works in Chromium --app windows; harmless no-op in the kiosk */
  /* desktop instance (launched with ?desktop=1) must NOT be closable */
  var IS_DESKTOP = /[?&]desktop=1\b/.test(location.search);
  if(el('closeBtn')){
    if(IS_DESKTOP){ el('closeBtn').style.display='none'; }
    else { el('closeBtn').addEventListener('click',function(){ window.close(); }); }
  }
  if(IS_DESKTOP) document.body.classList.add('desktop-mode');

  /* ---------------- boot ---------------- */
  window.DBShell={go:setActive, ticker:pushTicker};
  /* HOME real-data hook surface — home/home-live.js drives these.
     feeds()/status()/chips()/ticker() reassign the closure-local data and re-render. */
  function setTicker(arr){ if(arr&&arr.length){ TICKER=arr; renderTicker(); } }
  window.DBHome={
    feeds:function(news,crime,mesh){ if(news)NEWS=news; if(crime)CRIME=crime; if(mesh)MESH=mesh; if(active==='HOME')renderHomeCards(); },
    status:function(o){ if(o){ for(var k in o){ if(o.hasOwnProperty(k)) LIVE[k]=o[k]; } } renderStatus(); },
    chips:function(arr){ liveChips=arr; renderChips(); },
    ticker:setTicker,
    isHome:function(){ return active==='HOME'; }
  };
  setActive(active);
})();
</script>

<script>
/* ── Swipe navigation between tabs (tablet / touch) ────────────
   Horizontal swipe on the main content area cycles through tabs.
   Requires: deltaX > 50px, mostly horizontal (|deltaX| > |deltaY|*1.5).
   Ignores swipes that start on a scrollable container.
   ──────────────────────────────────────────────────────────────── */
(function() {
  var TAB_ORDER = ['HOME','MAP','OSINT','WX','ADSB','CONFLICT','MESH','SIGINT','MEDIA','AI','SYS'];
  var sx=0, sy=0, st=0, sEl=null;

  // Detect if the touch started inside a horizontally-scrolling container
  function isHScrollable(el) {
    while (el && el !== document.body) {
      var cs = getComputedStyle(el);
      var ov = cs.overflowX;
      if ((ov === 'auto' || ov === 'scroll') && el.scrollWidth > el.clientWidth + 4) return true;
      el = el.parentElement;
    }
    return false;
  }
  // Detect if the touch started on the MapLibre map canvas or map container.
  // MapLibre handles its own touch events for pan/zoom; a swipe on the map
  // must not also fire tab-switch navigation (was sending users to OSINT).
  function isMapSurface(el) {
    while (el && el !== document.body) {
      if (el.tagName === 'CANVAS') return true;
      if (el.classList && (el.classList.contains('maplibregl-map') ||
                           el.classList.contains('maplibregl-canvas-container'))) return true;
      el = el.parentElement;
    }
    return false;
  }

  var content = document.getElementById('content');
  if (!content) return;

  content.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    st = Date.now();
    sEl = e.target;
  }, { passive: true });

  content.addEventListener('touchend', function(e) {
    if (!sEl) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    var dt = Date.now() - st;
    var startEl = sEl;
    sEl = null;

    // Must be fast enough (<500ms), long enough (>50px), mostly horizontal
    if (dt > 500) return;
    if (Math.abs(dx) < 50) return;
    if (Math.abs(dy) > Math.abs(dx) * 0.65) return;
    if (isHScrollable(e.target)) return;
    // Don't swipe-navigate when the gesture started on the map canvas.
    // MapLibre handles pan internally; propagated touch events look like
    // large horizontal swipes and would kick the user off the MAP tab.
    if (isMapSurface(startEl)) return;

    // Find current tab index
    var cur = document.querySelector('.navitem.active');
    if (!cur) return;
    var curId = cur.dataset.id;
    var idx = TAB_ORDER.indexOf(curId);
    if (idx === -1) return;

    var next = dx < 0
      ? TAB_ORDER[Math.min(idx + 1, TAB_ORDER.length - 1)]
      : TAB_ORDER[Math.max(idx - 1, 0)];

    if (next !== curId && window.DBShell) window.DBShell.go(next);
  }, { passive: true });
})();
</script>
