<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DOOM BOX · MAP</title>
<style>
/* ============================================================
   DOOM BOX — standalone MAP launcher
   Thin host page: shared design tokens + slim top bar + the real
   MapLibre map mounted into #content via DBMap.ui.mount(). Used by
   the doombox-map.desktop launcher (chromium --app).
   ============================================================ */
:root{
  --scale:1;
  --bg-primary:#12121E; --bg-secondary:#1A1A2E; --bg-card:#0C1018;
  --accent:#E8B54A; --text-1:#FFFFFF; --text-2:#8898AA;
  --green:#5DD87A; --blue:#5EB8E8; --orange:#CC5511; --purple:#B08CF0; --red:#EE4444;
  --line:rgba(232,181,74,0.14); --line-soft:rgba(136,152,170,0.16);
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;
  --font-ui:Arial,'Helvetica Neue',Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:calc(16px * var(--scale));}
body{background:var(--bg-primary);color:var(--text-1);font-family:var(--font-ui);
  height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
.sa-top{flex:0 0 auto;height:42px;display:flex;align-items:center;gap:18px;
  padding:0 12px;background:var(--bg-card);border-bottom:1px solid var(--line);z-index:50;}
.sa-brand{font-family:var(--font-ui);font-weight:700;letter-spacing:.14em;color:var(--accent);font-size:.8rem;}
.sa-coord{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.72rem;color:var(--text-1);letter-spacing:.04em;}
.sa-coord .lbl{color:var(--text-2);}
.gps-dot{width:8px;height:8px;border-radius:50%;background:var(--text-2);flex:0 0 auto;}
.sa-spacer{flex:1;}
.ctl-close{position:relative;width:34px;height:30px;display:grid;place-items:center;
  background:var(--bg-card);border:1px solid var(--line-soft);color:var(--accent);
  font-family:var(--font-mono);font-size:.95rem;line-height:1;cursor:pointer;transition:.12s;}
.ctl-close::before{content:"";position:absolute;inset:2px;pointer-events:none;opacity:.75;background:
  linear-gradient(var(--accent),var(--accent)) no-repeat 0 0       / 7px 1px,
  linear-gradient(var(--accent),var(--accent)) no-repeat 0 0       / 1px 7px,
  linear-gradient(var(--accent),var(--accent)) no-repeat 100% 100% / 7px 1px,
  linear-gradient(var(--accent),var(--accent)) no-repeat 100% 100% / 1px 7px;}
.ctl-close:hover{background:var(--accent);color:#12121E;border-color:var(--accent);}
.ctl-close:hover::before{opacity:0;}
.ctl-close[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;
  background:var(--bg-secondary);border:1px solid var(--line);color:var(--text-1);
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;padding:5px 9px;white-space:nowrap;z-index:60;}
#content{flex:1 1 auto;position:relative;min-height:0;}
</style>
<link rel="stylesheet" href="../vendor/maplibre-gl.css" />
<link rel="stylesheet" href="map.css" />
</head>
<body>
  <div class="sa-top">
    <span class="sa-brand">DOOM&nbsp;BOX · MAP</span>
    <span class="sa-coord"><span class="gps-dot"></span><span class="lbl">MGRS</span> <span id="mgrs">—</span></span>
    <span class="sa-coord"><span class="lbl">LL</span> <span id="latlon">—</span></span>
    <span class="sa-spacer"></span>
    <button class="ctl-close" id="closeBtn" data-tip="CLOSE" aria-label="Close window">✕</button>
  </div>
  <main id="content"></main>

  <script src="../vendor/maplibre-gl.js"></script>
  <script src="../vendor/pmtiles.js"></script>
  <script src="../vendor/protomaps-themes-base.js"></script>
  <script src="../vendor/milsymbol.js"></script>
  <script src="../vendor/mgrs.min.js"></script>
  <script src="map-core.js"></script>
  <script src="map-layers.js"></script>
  <script src="map-tools.js"></script>
  <script src="map-mgrs-fetch.js"></script>
  <script src="map-ui.js"></script>
  <script>
    (function () {
      var cb = document.getElementById("closeBtn");
      if (cb) cb.addEventListener("click", function () { window.close(); });
      function boot() {
        if (window.DBMap && DBMap.ui) DBMap.ui.mount(document.getElementById("content"));
        else document.getElementById("content").innerHTML =
          '<div style="display:grid;place-items:center;height:100%;color:var(--red);font-family:var(--font-mono)">MAP ENGINE FAILED TO LOAD</div>';
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
      else boot();
    })();
  </script>
</body>
</html>
